services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ecolearn-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: ecolearn-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/docker.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      MINIO_ENDPOINT: local-s3:9000
      MINIO_EXTERNAL_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: kenneth
      MINIO_SECRET_KEY: kenneth2620
      MINIO_BUCKET_NAME: intelliteach
      # Add other backend env vars here
    depends_on:
      db:
        condition: service_healthy
      local-s3:
        condition: service_healthy
    # volumes:
    #   - ./backend:/app # Mount code for development; remove for production

  frontend:
    build: ./frontend
    container_name: ecolearn-frontend
    ports:
      - "8080:80" # Map host port 8080 to container port 80
    depends_on:
      - backend

  local-s3:
    image: minio/minio:latest
    container_name: intelliteach_s3
    environment:
      - MINIO_ROOT_USER=kenneth
      - MINIO_ROOT_PASSWORD=kenneth2620
    command: server /data --address :9000 --console-address :9001
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  s3_data: